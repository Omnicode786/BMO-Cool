[build-system]
requires = ["setuptools>=75,<82", "wheel>=0.45,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "bmo-pi"
version = "1.0.0"
description = "Realtime Raspberry Pi companion with Gemini Live STT, Gemini ADK brain, local vision, OLED, controls, and ElevenLabs TTS."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "MIT"}
authors = [{name = "BMO Pi project"}]
dependencies = [
  "google-adk==2.8.0",
  "google-genai==2.19.0",
  "websockets==15.0.1",
  "pydantic==2.12.5",
  "PyYAML==6.0.3",
  "sounddevice==0.5.6",
  "mediapipe==1.0.1",
  "Pillow==12.3.0",
  "psutil==7.2.2",
  "gpiozero==2.0.1.post3",
  "luma.oled==3.15.0",
  "pytesseract==0.3.13",
]

[project.scripts]
bmo-pi = "bmo.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["models", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]
